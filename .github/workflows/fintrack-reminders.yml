name: 💲Fintrack Reminders Dispatcher

on:
  schedule:
    # 03:30 UTC is exactly 09:00 AM IST
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Reminder Script
        env:
          PANTRY_BASKET_URL: ${{ secrets.PANTRY_BASKET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/fintrack-reminders.js
